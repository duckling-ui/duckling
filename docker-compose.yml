# Duckling Docker Compose Configuration
# Usage:
#   Development: docker-compose up --build
#   Production:  docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   With pre-built images: docker-compose -f docker-compose.prebuilt.yml up -d

services:
  redis:
    image: redis:7-alpine
    container_name: duckling-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - duckling-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: duckling-backend:latest
    container_name: duckling-backend
    ports:
      - "5001:5001"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./backend/data:/app/data
      - ./docs:/app/docs:ro
      - ./site:/app/site
      - ./mkdocs.yml:/app/mkdocs.yml:ro
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5001
      - DUCKLING_ENGINE_KIND=${DUCKLING_ENGINE_KIND:-local}
      - DUCKLING_RQ_REDIS_URL=${DUCKLING_RQ_REDIS_URL:-redis://redis:6379/0}
      - DUCKLING_LOG_LEVEL=${DUCKLING_LOG_LEVEL:-INFO}
      - DUCKLING_LOG_FORMAT=${DUCKLING_LOG_FORMAT:-text}
      - DUCKLING_ENABLE_REMOTE_SERVICES=${DUCKLING_ENABLE_REMOTE_SERVICES:-false}
      - DUCKLING_ALLOW_CUSTOM_VLM_CONFIG=${DUCKLING_ALLOW_CUSTOM_VLM_CONFIG:-false}
      - DUCKLING_API_KEY=${DUCKLING_API_KEY:-}
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - duckling-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    image: duckling-frontend:latest
    container_name: duckling-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - duckling-network

  rq-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: duckling-worker:latest
    container_name: duckling-rq-worker
    command: ["python", "worker.py", "--engine", "rq"]
    environment:
      - DUCKLING_ENGINE_KIND=rq
      - DUCKLING_RQ_REDIS_URL=${DUCKLING_RQ_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - duckling-network

networks:
  duckling-network:
    driver: bridge
